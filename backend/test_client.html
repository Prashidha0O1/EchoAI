<!DOCTYPE html>
<html>

<head>
    <title>EchoAI WebSocket Test</title>
</head>

<body>
    <h1>EchoAI WebSocket Test</h1>
    <button onclick="startRecording()">Start Recording</button>
    <button onclick="stopRecording()">Stop Recording</button>
    <div id="status">Status: Disconnected</div>
    <div id="transcription"></div>

    <script>
        let ws = new WebSocket("ws://localhost:8000/ws/interview");
        let mediaRecorder;
        let audioChunks = [];

        ws.onopen = () => {
            document.getElementById("status").innerText = "Status: Connected";
        };

        ws.onmessage = (event) => {
            // If it's JSON, it's transcription
            // If it's blob, it's audio response
            if (typeof event.data === "string") {
                const data = JSON.parse(event.data);
                if (data.type === "transcription") {
                    document.getElementById("transcription").innerText = "You said: " + data.text;
                }
            } else {
                // Play audio response
                const audioBlob = event.data;
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();
            }
        };

        async function startRecording() {
            audioChunks = []; // Clear previous chunks
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

            // Try to use WAV format for better compatibility
            const mimeType = 'audio/webm;codecs=opus'; // Most browsers support this
            mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data); // Accumulate instead of sending immediately
                }
            };

            mediaRecorder.onstop = () => {
                // Create a complete audio file from all chunks
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                console.log(`Sending complete audio: ${audioBlob.size} bytes`);

                // Send the complete audio file
                ws.send(audioBlob);

                // Clear chunks
                audioChunks = [];

                document.getElementById("status").innerText = "Status: Processing...";
            };

            // Don't send chunks, just accumulate them
            mediaRecorder.start();
            document.getElementById("status").innerText = "Status: Recording... (speak, then click Stop)";
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                // Stop all tracks to release microphone
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>

</html>
