[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "websockets",
    "openai-whisper",
    "pyttsx3",
    "soundfile",
    "numpy",
    "aiortc",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "email-validator",
    "redis>=7.1.0",
    "alembic>=1.17.2",
    "bcrypt==4.0.1",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "reportlab>=4.4.10",
    "weasyprint>=68.1",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=1.13.0",
    "aiosmtplib>=3.0.0",
    "aiofiles>=24.1.0",
    "pymupdf>=1.27.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
